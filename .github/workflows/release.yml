name: Release

on:
  # Auto-trigger when you publish a GitHub Release in the UI.
  release:
    types: [published]
  # Manual trigger from the Actions tab. Optionally attach the jars to an existing tag/release.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional: attach the built jars to this release tag (leave empty to skip upload and just produce artifacts)."
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build (release)
        run: mvn -B clean package --file pom.xml

      # Always upload as workflow artifact so you can grab the jars even
      # without an associated GitHub Release.
      - name: Upload jars as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedBan-RELEASE
          path: bundle/target/AdvancedBan-*-RELEASE.jar
          if-no-files-found: error

      # When triggered by a release event: attach to that release.
      - name: Attach jars to release (release event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bundle/target/AdvancedBan-Universal-*-RELEASE.jar
            bundle/target/AdvancedBan-Velocity-*-RELEASE.jar
          fail_on_unmatched_files: true

      # When triggered manually with a release_tag: attach to that tag.
      - name: Attach jars to release (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: |
            bundle/target/AdvancedBan-Universal-*-RELEASE.jar
            bundle/target/AdvancedBan-Velocity-*-RELEASE.jar
          fail_on_unmatched_files: true
