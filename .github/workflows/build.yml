name: Build

on:
  push:
    branches: [ master, main, development ]
  pull_request:
    branches: [ master, main, development ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build (release)
        run: mvn -B clean package --file pom.xml

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedBan-RELEASE
          path: bundle/target/AdvancedBan-*-RELEASE.jar
          if-no-files-found: error

  build-debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build (debug)
        run: mvn -Pdebug -B clean package --file pom.xml

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedBan-DEBUG
          path: bundle/target/AdvancedBan-*-DEBUG.jar
          if-no-files-found: error
